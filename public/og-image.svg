<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e" />
      <stop offset="50%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#1a0a2e" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="250" fill="#a855f7" opacity="0.08" />
  <circle cx="1000" cy="480" r="300" fill="#f43f5e" opacity="0.06" />

  <!-- Heart icon -->
  <g transform="translate(560, 160)" filter="url(#glow)">
    <path d="M40 20 C40 0 80 0 80 20 C80 50 40 70 40 70 C40 70 0 50 0 20 C0 0 40 0 40 20Z"
          fill="url(#text)" opacity="0.9" />
  </g>

  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="72" font-weight="900" letter-spacing="-1">
    SoulMate
    <tspan fill="url(#text)">.ai</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" fill="#b0b0d0" font-family="system-ui, sans-serif" font-size="28" font-weight="400">
    Meet Your AI Companion
  </text>

  <!-- CTA -->
  <text x="600" y="440" text-anchor="middle" fill="#d0d0e0" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    Upload a photo and let AI create your perfect virtual companion
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#text)" opacity="0.8" />
</svg>
